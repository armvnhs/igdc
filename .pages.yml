media:
  input: assets/img
  output: /assets/img
  extensions: [png, jpg, jpeg, webp, avif]
content:
  - name: site
    label: Site settings
    type: file
    path: content/site.json
    format: json
    fields:
      - name: siteName
        label: Club name
        type: string
        required: true
      - name: siteSubtitle
        label: Header subtitle
        type: string
      - name: heroTitle
        label: Homepage title
        type: string
      - name: heroDescription
        label: Homepage description
        type: text
      - name: logo
        label: Logo
        type: image
      - name: aboutTitle
        label: About title
        type: text
      - name: aboutDescription
        label: About description
        type: text
      - name: telegram
        label: Direct Telegram username
        type: string
      - name: telegramChannel
        label: Telegram channel URL
        type: string
      - name: instagramUrl
        label: Instagram URL
        type: string
      - name: membershipOpen
        label: Membership is open
        type: boolean
      - name: membershipUrl
        label: Membership application URL
        type: string
      - name: membershipIllustration
        label: Membership illustration
        type: image
      - name: fontFamily
        label: Website font
        type: string
        description: Font family name loaded by the site. Keep Ravi unless another uploaded web font is configured in CSS.
      - name: stats
        label: Statistics
        type: object
        list:
          max: 3
          collapsible:
            collapsed: true
            summary: '{fields.value} — {fields.label}'
        fields:
          - name: value
            label: Value
            type: string
          - name: label
            label: Label
            type: string
  - name: banner
    label: Hero slider
    type: file
    path: content/banner.json
    format: json
    fields:
      - name: enabled
        label: Enable slider
        type: boolean
      - name: autoplay
        label: Auto play slides
        type: boolean
      - name: autoplaySeconds
        label: Seconds per slide
        type: number
      - name: items
        label: Slides
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.title}'
        fields:
          - name: desktopImage
            label: Desktop image
            type: image
          - name: mobileImage
            label: Mobile image
            type: image
          - name: title
            label: Slide title
            type: string
          - name: description
            label: Slide description
            type: text
          - name: url
            label: Button URL
            type: string
          - name: buttonLabel
            label: Button label
            type: string
  - name: gallery
    label: Gallery
    type: file
    path: content/gallery.json
    format: json
    fields:
      - name: albums
        label: Albums (one per event)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.title} — {fields.date}'
        fields:
          - name: title
            label: Event name
            type: string
            required: true
          - name: date
            label: Event date
            type: string
          - name: description
            label: Short description
            type: text
          - name: cover
            label: Cover photo
            type: image
          - name: photos
            label: Photos of this event
            type: image
            list: true
  - name: members
    label: Members
    type: file
    path: content/members.json
    format: json
    fields:
      - name: items
        label: Members
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.name} — {fields.role}'
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: role
            label: Role
            type: string
          - name: image
            label: Portrait
            type: image
          - name: instagram
            label: Instagram URL
            type: string
          - name: linkedin
            label: Linkedin URL
            type: string
  - name: events
    label: Events
    type: file
    path: content/events.json
    format: json
    fields:
      - name: items
        label: Events
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.title}'
        fields:
          - name: id
            label: ID
            type: string
          - name: title
            label: Title
            type: string
            required: true
          - name: image
            label: Poster image (3:4)
            type: image
          - name: category
            label: Category
            type: string
          - name: day
            label: Day
            type: string
          - name: month
            label: Month
            type: string
          - name: year
            label: Year
            type: string
          - name: time
            label: Time
            type: string
          - name: location
            label: Location
            type: string
          - name: description
            label: Description
            type: text
          - name: admission
            label: Admission
            type: select
            options: [free, paid]
          - name: price
            label: Price
            type: string
          - name: registration
            label: Registration open
            type: boolean
          - name: registrationUrl
            label: Registration URL
            type: string
  - name: footer
    label: Footer
    type: file
    path: content/footer.json
    format: json
    fields:
      - name: eyebrow
        label: Eyebrow
        type: string
      - name: title
        label: Title
        type: text
      - name: description
        label: Description
        type: text
      - name: actionLabel
        label: Action label
        type: string
      - name: actionUrl
        label: Action URL
        type: string
      - name: brand
        label: Brand
        type: string
      - name: tagline
        label: Tagline
        type: text
      - name: linksTitle
        label: Links heading
        type: string
      - name: socialTitle
        label: Social heading
        type: string
      - name: copyright
        label: Copyright
        type: string
      - name: links
        label: Navigation links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: url
            label: URL
            type: string
      - name: socialLinks
        label: Social links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: url
            label: URL
            type: string
  - name: sponsors
    label: Sponsors
    type: file
    path: content/sponsors.json
    format: json
    fields:
      - name: title
        label: Section title
        type: string
      - name: description
        label: Section description
        type: text
      - name: items
        label: Sponsors
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: logo
            label: Logo
            type: image
          - name: url
            label: Website URL
            type: string
